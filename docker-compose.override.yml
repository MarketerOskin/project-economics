# Local development convenience — auto-loaded by plain `docker compose` commands.
# NOT used on the VPS (there compose is run with an explicit
# `-f docker-compose.yml -f docker-compose.prod.yml`, which skips this file).
services:
  db:
    # Bind to loopback only — the dev database uses a fixed throwaway password and
    # must never be reachable from outside this machine.
    ports:
      - '127.0.0.1:5432:5432'
  app:
    ports:
      - '127.0.0.1:3000:3000'
