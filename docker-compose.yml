services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: economics
      POSTGRES_PASSWORD: economics
      POSTGRES_DB: economics
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U economics -d economics']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://economics:economics@db:5432/economics?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
      # Left empty on purpose: in demo mode the entrypoint generates ephemeral secrets
      # so `docker compose up` works with zero config. For a real Bitrix24 install put
      # persistent values in .env (see .env.example) and set DEMO_MODE=false.
      SESSION_SECRET: ${SESSION_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      B24_CLIENT_ID: ${B24_CLIENT_ID:-}
      B24_CLIENT_SECRET: ${B24_CLIENT_SECRET:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - '3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  db-data:
