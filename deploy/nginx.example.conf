# Example reverse proxy for a VPS deployment of «Экономика проектов».
# Terminates TLS and forwards to the app container on :3000.
# Copy to /etc/nginx/sites-available/, adjust server_name + cert paths, symlink, reload.

upstream economics_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name economics.example.com;
    # ACME challenge for certbot, everything else -> HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name economics.example.com;

    ssl_certificate     /etc/letsencrypt/live/economics.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/economics.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The app is embedded in Bitrix24 as an iframe — allow only Bitrix ancestors.
    # (The app also sets its own CSP; this is defense in depth.)
    add_header Content-Security-Policy "frame-ancestors https://*.bitrix24.ru https://*.bitrix24.com https://*.bitrix24.de https://*.bitrix24.eu" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://economics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /api/health {
        proxy_pass http://economics_app;
        access_log off;
    }
}
